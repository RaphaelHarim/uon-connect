# Implantação de referência em um único servidor (Docker Compose).
# O jeito mais simples é o instalador: scripts/install.sh (gera .env.production, sobe tudo com HTTPS).
# HTTPS: use o perfil "https" (Caddy, abaixo) ou o proxy/load balancer que a TI já tiver.
# Sempre chame com --env-file .env.production. Veja docs/DEPLOYMENT.md.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-uon_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?defina POSTGRES_OWNER_PASSWORD}
      POSTGRES_DB: uon_connect
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d uon_connect"]
      interval: 10s
      retries: 10

  # Executa as migrações com o usuário proprietário (DDL) e encerra.
  migrate:
    image: ${UON_IMAGE:-uon-connect:latest}
    build: .
    command: ["node", "apps/api/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_OWNER_USER:-uon_owner}:${POSTGRES_OWNER_PASSWORD}@postgres:5432/uon_connect
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  app:
    image: ${UON_IMAGE:-uon-connect:latest}
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      # A aplicação usa um papel SEM privilégios de DDL e sem permissão de alterar a auditoria
      # (crie-o com docker/postgres/app-role.sql após a primeira migração).
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-uon_app}:${POSTGRES_APP_PASSWORD:?defina POSTGRES_APP_PASSWORD}@postgres:5432/uon_connect
      NODE_ENV: production
      TRUST_PROXY: "true"
    volumes:
      - files:/data
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # HTTPS automático na frente do app (docker compose --profile https up -d). Veja deploy/caddy/Caddyfile.
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10-alpine}
    profiles: ["https"]
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      UON_DOMAIN: ${UON_DOMAIN:-localhost}
      UON_TLS: ${UON_TLS:-auto}
      UON_ALLOWED_IPS: ${UON_ALLOWED_IPS:-0.0.0.0/0 ::/0}
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - ./deploy/caddy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
