<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>UON CONNECT — configuração</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f5f3; --surface:#fffefb; --fg:#1c1b19; --fg2:#4b4a46; --line:#e2e0db; --brand:#a8141c; --danger:#a8141c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141312; --surface:#1d1c1a; --fg:#f3f1ec; --fg2:#c9c5bd; --line:#34322e; --brand:#c22a32; --danger:#f28b90; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; }
  .card { width:100%; max-width:420px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:24px; }
  .brand { text-align:center; letter-spacing:.2em; font-weight:700; margin-bottom:20px; } .brand span { color:var(--brand); font-weight:400; }
  h1 { font-size:18px; margin:0 0 4px; } p { color:var(--fg2); margin:0 0 16px; }
  label { display:block; font-weight:600; font-size:13px; margin-bottom:6px; }
  input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--fg); font-size:14px; }
  button { margin-top:14px; width:100%; padding:11px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-weight:600; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.6; }
  .err { color:var(--danger); font-size:13px; margin-top:12px; min-height:1em; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">UON <span>CONNECT</span></div>
    <h1>Endereço do UON CONNECT</h1>
    <p>Digite o endereço informado pela administração da UON.</p>
    <form id="f">
      <label for="url">Endereço</label>
      <input id="url" type="text" inputmode="url" autocomplete="url" placeholder="https://connect.suaempresa.com.br" required autofocus>
      <div class="err" id="err" role="alert"></div>
      <button id="go" type="submit">Continuar</button>
    </form>
  </main>
  <script src="setup.js"></script>
</body>
</html>
