# Ambiente de DESENVOLVIMENTO: apenas os serviços de apoio.
# A API e a interface rodam no host com `npm run dev` (recarregamento automático).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uon
      POSTGRES_PASSWORD: uon_dev_password
      POSTGRES_DB: uon_connect
    ports: ["5432:5432"]
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./docker/postgres/dev-init.sql:/docker-entrypoint-initdb.d/01-dev-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uon -d uon_connect"]
      interval: 5s
      retries: 10

  # Caixa de e-mail local para ver as notificações enviadas (http://localhost:8025).
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]

volumes:
  pgdata-dev:
